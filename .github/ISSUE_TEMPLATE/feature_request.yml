name: 機能要望
description: 新機能や改善を提案します
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: どのような課題を解決したいかを記述してください。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false
