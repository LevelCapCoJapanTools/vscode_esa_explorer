name: バグ報告
description: 拡張機能の不具合を報告します
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        バグ報告ありがとうございます。以下の項目を記入してください。
  - type: textarea
    id: description
    attributes:
      label: 不具合の内容
      description: 何が起きたかを具体的に記述してください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 問題を再現する手順を記述してください。
      placeholder: |
        1. '...' を開く
        2. '...' をクリック
        3. エラーが表示される
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code バージョン
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: 拡張機能バージョン
    validations:
      required: true
